name: Mob-FGSR Android Stage 1

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/mobfgsr-stage1-720p
    paths:
      - '.github/workflows/mobfgsr-stage1.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'

permissions:
  contents: read

jobs:
  build-debug:
    name: Build Android debug APK (capture-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android application
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobfgsr-lab-arm64-v8a-debug-apk
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: warn
          retention-days: 14
