name: Mob-FGSR Android Stage 1

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/mobfgsr-stage1-720p
    paths:
      - '.github/workflows/mobfgsr-stage1.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'

permissions:
  contents: read

jobs:
  build-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android application
        uses: actions/checkout@v4
        with:
          path: LSFG-Sharpening-Android-Application

      # The app's CMakeLists expects this dependency as a sibling directory
      # of the Android project, not inside the app repository.
      - name: Checkout Vulkan frame-generation dependency
        uses: actions/checkout@v4
        with:
          repository: FrankBarretta/lsfg-vk-android
          ref: release
          path: lsfg-vk-android
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: LSFG-Sharpening-Android-Application
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobfgsr-stage1-debug-apk
          path: LSFG-Sharpening-Android-Application/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
