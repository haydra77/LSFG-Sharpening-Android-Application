name: Build LSFG Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Checkout LSFG Vulkan frame-generation engine
        run: |
          git clone --depth 1 --branch release https://github.com/FrankBarretta/lsfg-vk-android.git "$GITHUB_WORKSPACE/../lsfg-vk-android"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ARM64 debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LSFG-Android-Sharpen-arm64
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14
