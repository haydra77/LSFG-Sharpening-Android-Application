name: Build LSFG Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Checkout LSFG Vulkan frame-generation engine
        run: |
          git clone --depth 1 --branch release https://github.com/FrankBarretta/lsfg-vk-android.git "$GITHUB_WORKSPACE/../lsfg-vk-android"
          cd "$GITHUB_WORKSPACE/../lsfg-vk-android"
          git submodule update --init --depth 1 -- thirdparty/pe-parse thirdparty/toml11 thirdparty/volk
          # PancakeTAS/dxbc was deleted upstream. Use the preserved source snapshot
          # vendored by Bloodframe (DXBC commit 78ab59a).
          tmp="$(mktemp -d)"
          curl -fsSL https://codeload.github.com/ducvd89/bloodframe/tar.gz/refs/heads/main | tar -xz --strip-components=1 -C "$tmp"
          rm -rf thirdparty/dxbc
          cp -a "$tmp/thirdparty/dxbc" thirdparty/dxbc
          rm -rf "$tmp"
          # Adreno reports Vulkan 1.1.128. The upstream Android device setup
          # used Vulkan 1.3 synchronization2 features without enabling the
          # KHR extension, leaving vkCmdPipelineBarrier2 unresolved (null).
          python3 - <<'PY'
          from pathlib import Path
          p = Path("framegen/src/core/device.cpp")
          s = p.read_text()
          old_ext = '    "VK_KHR_maintenance1",                     // dependency\n'
          new_ext = old_ext + '    "VK_KHR_synchronization2",              // required for vkCmdPipelineBarrier2 on Vulkan 1.1 drivers\n'
          if old_ext not in s:
              raise SystemExit("Could not find Android required-extension insertion point")
          s = s.replace(old_ext, new_ext, 1)
          old_feature = 'VkPhysicalDeviceVulkan13Features features13{\n        .sType = VK_STRUCTURE_TYPE_PHYSICAL_DEVICE_VULKAN_1_3_FEATURES,'
          new_feature = 'VkPhysicalDeviceSynchronization2FeaturesKHR features13{\n        .sType = VK_STRUCTURE_TYPE_PHYSICAL_DEVICE_SYNCHRONIZATION_2_FEATURES_KHR,'
          if old_feature not in s:
              raise SystemExit("Could not find Vulkan 1.3 feature structure to replace")
          s = s.replace(old_feature, new_feature, 1)
          s = s.replace('    volkLoadDevice(deviceHandle);\n', '    volkLoadDevice(deviceHandle);\n    if (vkCmdPipelineBarrier2KHR == nullptr) {\n        vkDestroyDevice(deviceHandle, nullptr);\n        throw LSFG::vulkan_error(VK_ERROR_EXTENSION_NOT_PRESENT, "vkCmdPipelineBarrier2KHR was not loaded after enabling VK_KHR_synchronization2");\n    }\n', 1)
          p.write_text(s)

          # Vulkan 1.1 exposes the synchronization2 extension entry point with
          # the KHR suffix. The unsuffixed core 1.3 symbol remains null on 1.1.
          for rel in ("framegen/src/common/utils.cpp",
                      "framegen/v3.1p_src/context.cpp",
                      "framegen/v3.1_src/context.cpp"):
              q = Path(rel)
              if q.exists():
                  t = q.read_text()
                  t = t.replace("vkCmdPipelineBarrier2(", "vkCmdPipelineBarrier2KHR(")
                  q.write_text(t)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK and CMake
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile GPU post-processing shader
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc
          cd app/src/main/cpp
          glslc --target-env=vulkan1.1 -O gpu_postprocess.comp -o gpu_postprocess.spv
          python3 - <<'PY'
          import struct
          from pathlib import Path
          spv = Path("gpu_postprocess.spv").read_bytes()
          if len(spv) % 4:
              raise SystemExit("SPIR-V bytecode size is not 4-byte aligned")
          words = struct.unpack("<" + "I" * (len(spv) // 4), spv)
          lines = [
              "#pragma once",
              "",
              "#include <cstdint>",
              "",
              "namespace lsfg_android {",
              "",
              "alignas(4) static constexpr uint32_t kGpuPostprocessCompSpv[] = {",
          ]
          for i in range(0, len(words), 8):
              lines.append("    " + ", ".join(f"0x{v:08x}u" for v in words[i:i+8]) + ",")
          lines += [
              "};",
              "static constexpr uint32_t kGpuPostprocessCompSpvSize = sizeof(kGpuPostprocessCompSpv);",
              "",
              "} // namespace lsfg_android",
              "",
          ]
          Path("gpu_postprocess_spv.hpp").write_text("\\n".join(lines))
          print(f"Compiled GPU shader: {len(spv)} bytes")
          PY

      - name: Build ARM64 debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Collect unstripped native libraries
        shell: bash
        run: |
          mkdir -p native-symbols
          find app/build -type f -name 'liblsfg-android.so' -print0 | while IFS= read -r -d '' file; do
            rel="${file#app/build/}"
            mkdir -p "native-symbols/$(dirname "$rel")"
            cp "$file" "native-symbols/$rel"
          done
          test -n "$(find native-symbols -type f -name 'liblsfg-android.so' -print -quit)"
          tar -czf lsfg-native-symbols-arm64.tar.gz native-symbols

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LSFG-Android-Sharpen-arm64
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: LSFG-native-debug-symbols
          path: lsfg-native-symbols-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
